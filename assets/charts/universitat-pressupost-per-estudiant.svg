<svg xmlns="http://www.w3.org/2000/svg" width="620" height="924" viewBox="0 0 620 924" role="img" aria-labelledby="uc-title uc-desc">
  <title id="uc-title">Cost total aproximat d'una matrícula</title>
  <desc id="uc-desc">El pressupost per estudiant és una aproximació als recursos anuals de la universitat, no una mesura del cost docent d'una matrícula. Pressupost inicial 2025 dividit pels estudiants de grau, màster i doctorat del curs 2024-2025. La barra gran distingeix finançament previst de la Generalitat i resta del pressupost, que inclou el cost assumit per l'estudiant i pot contenir altres fons públics. La barra blava separada compara la factura orientativa de 60 crèdits nous de grau el 2026-2027, incloent altres conceptes de matrícula, amb les hipòtesis de la taula de l'article. No és el pagament mitjà observat. UB: factura de referència 1.202,32 €. UAB: factura de referència 1.202,32 €. UPC: factura de referència 1.202,32 €. UPF: factura de referència 1.202,32 €. UdG: factura de referència 1.202,32 €. UdL: factura de referència 1.213,53 €. URV: factura de referència 1.206,61 €. UB: pressupost per estudiant aproximat 10.205,61 €, Generalitat 6.883,27 €. UAB: pressupost per estudiant aproximat 11.975,64 €, Generalitat 7.598,50 €. UPC: pressupost per estudiant aproximat 13.356,40 €, Generalitat 8.455,23 €. UPF: pressupost per estudiant aproximat 14.573,39 €, Generalitat 7.771,96 €. UdG: pressupost per estudiant aproximat 10.349,82 €, Generalitat 6.945,34 €. UdL: pressupost per estudiant aproximat 10.622,76 €, Generalitat 7.712,64 €. URV: pressupost per estudiant aproximat 8.787,48 €, Generalitat 6.744,13 €. No és cost docent per grau ni un rànquing d'eficiència.</desc>
