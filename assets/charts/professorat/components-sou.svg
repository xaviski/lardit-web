<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc"><title id="title">Components del sou brut d’un mestre públic a Catalunya · 2026</title><desc id="desc">Sou base: 16.143,90 euros anuals. Estat. 12 ordinàries + 2 components de sou extra. Destinació · nivell 21: 8.289,54 euros anuals. Generalitat, dins del marc bàsic estatal i dels límits globals d’increment retributiu. 14 pagues. Específic general: 9.869,30 euros anuals. Generalitat. 14 pagues. Millora del servei: 700,00 euros anuals. Generalitat. 50 € × 14 pagues. Increment específic 2026: 839,02 euros anuals. Generalitat. Pagament únic al maig. Total: 35.841,76 euros bruts anuals; mes ordinari: 2.546,58 euros. Sense antiguitat ni complements singulars. Els colors indiquen qui fixa els imports, no qui els paga.</desc><rect width="760" height="620" fill="#f4efe5"/><text x="12" y="26" font-family="Arial,sans-serif" font-size="24" text-anchor="start" fill="#132a38" font-weight="700">Qui fixa cada part del sou?</text><text x="12" y="50" font-family="Arial,sans-serif" font-size="15" text-anchor="start" fill="#52636d" font-weight="400">Mestre públic · Catalunya · Jornada completa · 2026</text><text x="12" y="89" font-family="Arial,sans-serif" font-size="30" text-anchor="start" fill="#132a38" font-weight="700">35.841,76 € bruts/any</text><text x="12" y="115" font-family="Arial,sans-serif" font-size="16" text-anchor="start" fill="#52636d" font-weight="400">Mes ordinari: 2.546,58 €</text><rect x="12" y="138" width="12" height="12" fill="#1c6579"/><text x="32" y="148" font-family="Arial,sans-serif" font-size="14" text-anchor="start" fill="#132a38" font-weight="400">Estat</text><rect x="150" y="138" width="12" height="12" fill="#ae372f"/><text x="170" y="148" font-family="Arial,sans-serif" font-size="14" text-anchor="start" fill="#132a38" font-weight="400">Generalitat</text><rect data-component="base" data-annual="16143.9" data-authority="state" x="12