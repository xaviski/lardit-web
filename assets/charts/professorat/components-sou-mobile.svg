<svg xmlns="http://www.w3.org/2000/svg" width="360" height="710" viewBox="0 0 360 710" role="img" aria-labelledby="title desc"><title id="title">Components del sou brut d’un mestre públic a Catalunya · 2026</title><desc id="desc">Sou base: 16.143,90 euros anuals. Estat. 12 ordinàries + 2 components de sou extra. Destinació · nivell 21: 8.289,54 euros anuals. Generalitat, dins del marc bàsic estatal i dels límits globals d’increment retributiu. 14 pagues. Específic general: 9.869,30 euros anuals. Generalitat. 14 pagues. Millora del servei: 700,00 euros anuals. Generalitat. 50 € × 14 pagues. Increment específic 2026: 839,02 euros anuals. Generalitat. Pagament únic al maig. Total: 35.841,76 euros bruts anuals; mes ordinari: 2.546,58 euros. Sense antiguitat ni complements singulars. Blau: Estat; quatre tons càlids: Generalitat. Cada tram té el mateix color que la fila del seu component, en el mateix ordre. Els colors indiquen qui fixa els imports, no qui els paga.</desc><rect width="360" height="710" fill="#f4efe5"/><text x="12" y="26" font-family="Arial,sans-serif" font-size="19" text-anchor="start" fill="#132a38" font-weight="700">Qui fixa cada part del sou?</text><text x="12" y="50" font-family="Arial,sans-serif" font-size="12" text-anchor="start" fill="#52636d" font-weight="400">Mestre públic · Catalunya · Jornada completa · 2026</text><text x="12" y="89" font-family="Arial,sans-serif" font-size="26" text-anchor="start" fill="#132a38" font-weight="700">35.841,76 € bruts/any</text><text x="12" y="115" font-family="Arial,sans-serif" font-size="14" text-anchor="start" fill="#52636d" font-weight="400">Mes ordinari: 2.546,58 €</text><rect x="12" y="138" width="10" height="12" fill="#1c6579"/><text x="31" y="148" font-family="Arial,sans-serif" font-size="13" text-anchor="start" fill="#132a38" font-weight="400">Estat</text><rect x="150" y="138" width="10" height="12" fill="#7b253a"/><rect x="161" y="138" width="10" height="12" fill="#ba4b35"/><rect x="172" y="138" width="1