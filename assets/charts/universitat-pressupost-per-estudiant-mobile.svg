<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1120" viewBox="0 0 360 1120" role="img" aria-labelledby="ucm-title ucm-desc">
  <title id="ucm-title">Pressupost anual per estudiant i matrícula de referència</title>
  <desc id="ucm-desc">Pressupost inicial 2025 dividit pels estudiants de grau, màster i doctorat del curs 2024-2025. La barra gran distingeix finançament previst de la Generalitat i resta del pressupost, que pot contenir altres fons públics. La barra blava separada representa una matrícula de referència de 60 crèdits de 1.061,40 euros, no l'ingrés mitjà observat per estudiant. UB: pressupost per estudiant aproximat 10.200 €, Generalitat 6.900 €. UAB: pressupost per estudiant aproximat 12.000 €, Generalitat 7.600 €. UPC: pressupost per estudiant aproximat 13.400 €, Generalitat 8.500 €. UPF: pressupost per estudiant aproximat 14.600 €, Generalitat 7.800 €. UdG: pressupost per estudiant aproximat 10.300 €, Generalitat 6.900 €. UdL: pressupost per estudiant aproximat 10.600 €, Generalitat 7.700 €. URV: pressupost per estudiant aproximat 8.800 €, Generalitat 6.700 €. No és cost docent per grau ni un rànquing d'eficiència.</desc>
  <rect width="360" height="1120" fill="#f4efe4"/>
  <g font-family="system-ui, sans-serif" fill="#132a38">
    <text x="18" y="28" fill="#a83a32" font-size="11" font-weight="700" letter-spacing="0.8">CATALUNYA · PRESSUPOST 2025</text>
    <text x="18" y="65" font-family="Georgia, serif" font-size="27" font-weight="700">Més enllà</text>
    <text x="18" y="98" font-family="Georgia, serif" font-size="27" font-weight="700">de la matrícula</text>
    <text x="18" y="122" fill="#52616a" font-size="13">Recursos anuals per estudiant: aproximació</text>
    <rect x="18" y="141" width="14" height="14" fill="#a83a32"/><text x="42" y="153" font-size="12">Generalitat: finançament previst*</text>
    <rect x="18" y="164" width="14" height="14" fill="#d6ccba"/><text x="42" y="175" font-size="12">Resta del pressupost (pot incloure</text><text x="42" y="191" font-size="12">altres aportacions públiques)</text>
    <rect x="18" y="202" width="14" height="8" fill="#1d5d73"/><text x="42" y="211" font-size="12">Matrícula comparada: 60 crèdits</text>
    <line x1="18" y1="223" x2="342" y2="223" stroke="#132a38" stroke-opacity="0.4"/>
    <g aria-label="UB">
      <text x="18" y="246" font-size="17" font-weight="750">UB</text><text x="342" y="246" text-anchor="end" font-size="16" font-weight="700">10.200 €</text>
      <rect x="18" y="255" width="139.386" height="23" fill="#a83a32"/><rect x="157.386" y="255" width="67.277" height="23" fill="#d6ccba"/>
      <text x="18" y="294" fill="#52616a" font-size="11.7">Generalitat 6.900 € · resta 3.300 €</text>
      <rect x="18" y="304" width="21.493" height="8" fill="#1d5d73"/><text x="47.493" y="312" fill="#1d5d73" font-size="12">matrícula: 1.061 €</text>
    </g>
    <g aria-label="UAB">
      <text x="18" y="342" font-size="17" font-weight="750">UAB</text><text x="342" y="342" text-anchor="end" font-size="16" font-weight="700">12.000 €</text>
      <rect x="18" y="351" width="153.870" height="23" fill="#a83a32"/><rect x="171.870" y="351" width="88.637" height="23" fill="#d6ccba"/>
      <text x="18" y="390" fill="#52616a" font-size="11.7">Generalitat 7.600 € · resta 4.400 €</text>
      <rect x="18" y="400" width="21.493" height="8" fill="#1d5d73"/><text x="47.493" y="408" fill="#1d5d73" font-size="12">matrícula: 1.061 €</text>
    </g>
    <g aria-label="UPC">
      <text x="18" y="438" font-size="17" font-weight="750">UPC</text><text x="342" y="438" text-anchor="end" font-size="16" font-weight="700">13.400 €</text>
      <rect x="18" y="447" width="171.218" height="23" fill="#a83a32"/><rect x="189.218" y="447" width="99.249" height="23" fill="#d6ccba"/>
      <text x="18" y="486" fill="#52616a" font-size="11.7">Generalitat 8.500 € · resta 4.900 €</text>
      <rect x="18" y="496" width="21.493" height="8" fill="#1d5d73"/><text x="47.493" y="504" fill="#1d5d73" font-size="12">matrícula: 1.061 €</text>
    </g>
    <g aria-label="UPF">
      <text x="18" y="534" font-size="17" font-weight="750">UPF</text><text x="342" y="534" text-anchor="end" font-size="16" font-weight="700">14.600 €</text>
      <rect x="18" y="543" width="157.382" height="23" fill="#a83a32"/><rect x="175.382" y="543" width="137.729" height="23" fill="#d6ccba"/>
      <text x="18" y="582" fill="#52616a" font-size="11.7">Generalitat 7.800 € · resta 6.800 €</text>
      <rect x="18" y="592" width="21.493" height="8" fill="#1d5d73"/><text x="47.493" y="600" fill="#1d5d73" font-size="12">matrícula: 1.061 €</text>
    </g>
    <g aria-label="UdG">
      <text x="18" y="630" font-size="17" font-weight="750">UdG</text><text x="342" y="630" text-anchor="end" font-size="16" font-weight="700">10.300 €</text>
      <rect x="18" y="639" width="140.643" height="23" fill="#a83a32"/><rect x="158.643" y="639" width="68.941" height="23" fill="#d6ccba"/>
      <text x="18" y="678" fill="#52616a" font-size="11.7">Generalitat 6.900 € · resta 3.400 €</text>
      <rect x="18" y="688" width="21.493" height="8" fill="#1d5d73"/><text x="47.493" y="696" fill="#1d5d73" font-size="12">matrícula: 1.061 €</text>
    </g>
    <g aria-label="UdL">
      <text x="18" y="726" font-size="17" font-weight="750">UdL</text><text x="342" y="726" text-anchor="end" font-size="16" font-weight="700">10.600 €</text>
      <rect x="18" y="735" width="156.181" height="23" fill="#a83a32"/><rect x="174.181" y="735" width="58.930" height="23" fill="#d6ccba"/>
      <text x="18" y="774" fill="#52616a" font-size="11.7">Generalitat 7.700 € · resta 2.900 €</text>
      <rect x="18" y="784" width="21.493" height="8" fill="#1d5d73"/><text x="47.493" y="792" fill="#1d5d73" font-size="12">matrícula: 1.061 €</text>
    </g>
    <g aria-label="URV">
      <text x="18" y="822" font-size="17" font-weight="750">URV</text><text x="342" y="822" text-anchor="end" font-size="16" font-weight="700">8.800 €</text>
      <rect x="18" y="831" width="136.569" height="23" fill="#a83a32"/><rect x="154.569" y="831" width="41.378" height="23" fill="#d6ccba"/>
      <text x="18" y="870" fill="#52616a" font-size="11.7">Generalitat 6.700 € · resta 2.000 €</text>
      <rect x="18" y="880" width="21.493" height="8" fill="#1d5d73"/><text x="47.493" y="888" fill="#1d5d73" font-size="12">matrícula: 1.061 €</text>
    </g>
    <text x="18" y="946" fill="#52616a" font-size="11" text-anchor="start">0</text>
    <text x="119.25" y="946" fill="#52616a" font-size="11" text-anchor="middle">5.000</text>
    <text x="220.5" y="946" fill="#52616a" font-size="11" text-anchor="middle">10.000</text>
    <text x="321.75" y="946" fill="#52616a" font-size="11" text-anchor="middle">15.000</text>
    <text x="342" y="966" text-anchor="end" fill="#52616a" font-size="11">Euros anuals per estudiant · escala comuna</text>
    <line x1="18" y1="983" x2="342" y2="983" stroke="#132a38" stroke-opacity="0.35"/>
    <text x="18" y="1007" font-size="11.7">*Generalitat i fons canalitzats o vinculats.</text>
    <text x="18" y="1026" font-size="11.7">No representa tot el finançament públic.</text>
    <text x="18" y="1050" fill="#52616a" font-size="11.5">La matrícula és una referència de grau:</text>
    <text x="18" y="1068" fill="#52616a" font-size="11.5">sense ajuts ni taxes, no un ingrés mitjà real.</text>
    <text x="18" y="1093" fill="#52616a" font-size="11">Càlcul propi · pressupost arrodonit a 100 €</text>
  </g>
</svg>
