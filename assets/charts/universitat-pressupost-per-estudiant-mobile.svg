    </g>
    <g aria-label="UPF">
      <text x="18" y="534" font-size="17" font-weight="750">UPF</text><text x="342" y="534" text-anchor="end" font-size="16" font-weight="700">14.573,39 €</text>
      <rect x="18" y="543" width="157.382" height="23" fill="#a83a32"/><rect x="175.382" y="543" width="137.729" height="23" fill="#d6ccba"/>
      <text x="18" y="582" fill="#52616a" font-size="11.7">Generalitat 7.771,96 € · resta 6.801,43 €</text>
      <rect x="18" y="592" width="24.347" height="8" fill="#1d5d73"/><text x="50.347" y="600" fill="#1d5d73" font-size="12">1.202,32 €</text>
