      <text x="18" y="390" fill="#52616a" font-size="11.7">Generalitat 7.598,50 € · resta 4.377,14 €</text>
      <rect x="18" y="400" width="24.347" height="8" fill="#1d5d73"/><text x="50.347" y="408" fill="#1d5d73" font-size="12">1.202,32 €</text>
