<svg xmlns="http://www.w3.org/2000/svg" width="760" height="491" viewBox="0 0 760 491" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Canvi real aproximat de la despesa per edat del sustentador, 2016–2019</title>
