<svg xmlns="http://www.w3.org/2000/svg" width="360" height="535" viewBox="0 0 360 535" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Despesa de consum segons l’edat del sustentador principal, 2024</title>
<desc id="chart-description">Despesa anual per unitat de consum: de 16 a 29 anys, 18.755 euros; de 30 a 44, 20.148; de 45 a 59, 21.521; de 60 a 74, 24.907; 75 anys o més, 22.550. Preus corrents. No són grups d’edat de cada consumidor.</desc>
<rect x="0" y="0" width="360" height="535" fill="#f4efe5" rx="0"/>
<text x="12" y="24" fill="#132a38" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400">Catalunya · 2024 · Euros anuals per unitat de consum</text><text x="12" y="48" fill="#52636d" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400">Edat del sustentador principal de la llar</text><line x1="67" y1="90" x2="67" y2="361" stroke="#d4cfc5" stroke-width="1"/><text x="67" y="385" fill="#52636d" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="400">0</text><line x1="152" y1="90" x2="152" y2="361" stroke="#d4cfc5" stroke-width="1"/><text x="152" y="385" fill="#52636d" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="400">10.000</text><line x1="237" y1="90" x2="237" y2="361" stroke="#d4cfc5" stroke-width="1"/><text x="237" y="385" fill="#52636d" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="400">20.000</text><text x="12" y="121" fill="#132a38" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="600">16–29</text><rect x="67" y="103" width="159.4175" height="27" fill="#1c6579" rx="0"/><text x="348" y="122" fill="#1c6579" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700">18.755 €</text><text x="12" y="179" fill="#132a38" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="600">30–44</text><rect x="67" y="161" width="171.258" height="27" fill="#1c6579" rx="0"/><text x="348" y="180" fill="#1c6579" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700">20.148 €</text><text x="12" y="237" fill="#132a38" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="600">45–59</text><rect x="67" y="219" width="182.9285" height="27" fill="#1c6579" rx="0"/><text x="348" y="238" fill="#1c6579" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700">21.521 €</text><text x="12" y="295" fill="#132a38" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="600">60–74</text><rect x="67" y="277" width="211.7095" height="27" fill="#1c6579" rx="0"/><text x="348" y="296" fill="#1c6579" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700">24.907 €</text><text x="12" y="353" fill="#132a38" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="600">75+</text><rect x="67" y="335" width="191.675" height="27" fill="#1c6579" rx="0"/><text x="348" y="354" fill="#1c6579" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700">22.550 €</text><text x="12" y="415" fill="#52636d" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400">Preus corrents. Unitat de consum: ajust per</text><text x="12" y="432" fill="#52636d" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400">mida i composició de la llar. Inclou lloguer</text><text x="12" y="449" fill="#52636d" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400">imputat.</text><text x="12" y="470" fill="#52636d" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400">2024: ruptura de sèrie. Fotografia d’un sol</text><text x="12" y="487" fill="#52636d" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400">any; no és l’edat de cada consumidor.</text>
</svg>
