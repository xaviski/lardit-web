<svg xmlns="http://www.w3.org/2000/svg" width="360" height="861" viewBox="0 0 360 861" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">PIB, PIB per habitant i components del creixement demogràfic de Catalunya, 2019–2025</title>
<desc id="chart-description">Dos panells amb el mateix eix temporal. A dalt: PIB real i PIB real per habitant, amb 2019 igual a zero. A sota: contribucions demogràfiques respecte de la població a final del 2019. Fins al final del 2024: saldo migratori +5,91 punts, saldo natural −0,96 i ajust estadístic +0,11; població total +5,06%. El 2025 només hi ha població total provisional (+6,18%); no s’inventen els components que falten. Les dates demogràfiques no són exactament les del denominador del PIB per habitant.</desc>
