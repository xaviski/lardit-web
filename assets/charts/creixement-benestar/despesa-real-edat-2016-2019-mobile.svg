<svg xmlns="http://www.w3.org/2000/svg" width="360" height="533" viewBox="0 0 360 533" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Canvi real aproximat de la despesa per edat del sustentador, 2016–2019</title>
<desc id="chart-description">Comparació històrica dins d’un tram homogeni de l’EPF, descomptant aproximadament l’IPC general català. No es comparen dades a través de les ruptures de 2023 i 2024.</desc>
<rect x="0" y="0" width="360" height="533" fill="#f4efe5" rx="0"/>
