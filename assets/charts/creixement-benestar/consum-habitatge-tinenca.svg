<svg xmlns="http://www.w3.org/2000/svg" width="760" height="504" viewBox="0 0 760 504" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Canvi del consum monetari segons la situació residencial, 2019–2025</title>
<desc id="chart-description">Lloguer: tot el consum monetari −10,9%; sense lloguer de l’habitatge principal ni subministraments bàsics −13,3%. Propietat amb hipoteca: tot el consum monetari −11,8%; sense lloguer de l’habitatge principal ni subministraments bàsics −11,5%. Propietat sense hipoteca: tot el consum monetari −6,6%; sense lloguer de l’habitatge principal ni subministraments bàsics −6,1%. Despesa per unitat de consum. Ajust aproximat amb IPC general. No és una estimació de l’efecte causal de l’habitatge.</desc>
