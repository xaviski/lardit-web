<svg xmlns="http://www.w3.org/2000/svg" width="760" height="493" viewBox="0 0 760 493" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Despesa de consum segons l’edat del sustentador principal, 2024</title>
<desc id="chart-description">Despesa anual per unitat de consum: de 16 a 29 anys, 18.755 euros; de 30 a 44, 20.148; de 45 a 59, 21.521; de 60 a 74, 24.907; 75 anys o més, 22.550. Preus corrents. No són grups d’edat de cada consumidor.</desc>
